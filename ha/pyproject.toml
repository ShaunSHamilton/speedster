[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = [".git"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",  # Any is the honest type for an options mapping
  "COM812",  # handled by the formatter
  "D203",
  "D213",
  "ISC001",
  "PLR0913", # the engine genuinely needs its knobs passed through
  "T201",    # manual_run.py prints on purpose
  "TRY300",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D", "S101", "SLF001", "PLR2004", "PT019"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = true
