name: Validate integration

on:
  push:
    paths:
      - "custom_components/**"
      - "ha/**"
      - "portal.html"
      - "hacs.json"
      - ".github/workflows/ha-validate.yml"
  pull_request:
    paths:
      - "custom_components/**"
      - "ha/**"
      - "portal.html"
      - "hacs.json"
      - ".github/workflows/ha-validate.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ha/requirements-dev.txt
      - run: pip install -r ha/requirements-dev.txt
      - run: ruff check --config ha/pyproject.toml custom_components ha
      - run: ruff format --check --config ha/pyproject.toml custom_components ha
      - run: mypy --config-file ha/pyproject.toml custom_components/speedster
      - run: pytest -q -c ha/pyproject.toml

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
