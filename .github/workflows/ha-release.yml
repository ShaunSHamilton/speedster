name: Release integration

# HACS installs whatever is at the root of the zip, so the package is repackaged
# with portal.html copied in from the repo root - the template stays a single
# source of truth shared with the Windows build.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Stamp the manifest version from the tag
        if: github.event_name == 'release'
        run: |
          version="${GITHUB_REF_NAME#v}"
          python - "$version" <<'PY'
          import json, sys, pathlib
          path = pathlib.Path("ha/custom_components/speedster/manifest.json")
          manifest = json.loads(path.read_text())
          manifest["version"] = sys.argv[1]
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Build speedster.zip
        run: |
          mkdir -p build
          cp -r ha/custom_components build/
          cp portal.html build/custom_components/speedster/portal.html
          cd build && zip -r ../speedster.zip custom_components

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: speedster.zip

      - uses: actions/upload-artifact@v4
        with:
          name: speedster-zip
          path: speedster.zip
