name: Release integration

# HACS extracts release archives directly into custom_components/speedster.
# Package integration files at archive root and add shared report template.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Stamp the manifest version from the tag
        if: github.event_name == 'release'
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg version "$version" '.version = $version' \
            custom_components/speedster/manifest.json > manifest.json
          mv manifest.json custom_components/speedster/manifest.json

      - name: Build speedster.zip
        run: |
          mkdir -p build
          cp -r custom_components/speedster/. build/
          cp portal.html build/portal.html
          cd build && zip -r ../speedster.zip .

      - name: Validate archive layout
        run: |
          test "$(unzip -Z1 speedster.zip | grep -c '^manifest.json$')" -eq 1
          test "$(unzip -Z1 speedster.zip | grep -c '^portal.html$')" -eq 1
          ! unzip -Z1 speedster.zip | grep -q '^custom_components/'

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: speedster.zip

      - uses: actions/upload-artifact@v4
        with:
          name: speedster-zip
          path: speedster.zip
